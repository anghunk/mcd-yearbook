[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcd-yearbook"
version = "1.0.0"
description = "麦麦年鉴 —— 可溯源的麦当劳消费年度回顾，基于麦当劳官方 MCP"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[project.scripts]
mcd-yearbook = "yearbook.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
